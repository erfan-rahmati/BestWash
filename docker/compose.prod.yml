name: bestwash

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bestwash}
      POSTGRES_USER: ${POSTGRES_USER:-bestwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bestwash} -d ${POSTGRES_DB:-bestwash}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment: ["REDIS_PASSWORD=${REDIS_PASSWORD}"]
    networks: [backend]

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    env_file: ../.env
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["3001"]
    volumes:
      - media_uploads:/app/apps/api/uploads/media
    networks: [backend, edge]

  worker:
    build: { context: .., dockerfile: docker/Dockerfile.worker }
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
        NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY}
    restart: unless-stopped
    expose: ["3000"]
    networks: [edge]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    networks: [edge]

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  backend: { internal: true }
  edge:
