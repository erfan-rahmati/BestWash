limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
upstream bestwash_web { server web:3000; }
upstream bestwash_api { server api:3001; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 5m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;

  location ~ /\. { deny all; }
  location ~* \.map$ { return 404; }
  location = /api/v1/docs { return 404; }
  location = /api/v1/openapi.json { return 404; }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://bestwash_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/api/v1/(auth|admin|customers/me)(/|$) {
    limit_req zone=api_limit burst=30 nodelay;
    add_header Cache-Control "private, no-store, max-age=0" always;
    proxy_pass http://bestwash_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://bestwash_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
